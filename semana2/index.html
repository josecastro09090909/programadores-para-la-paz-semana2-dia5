<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Participa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        p {
            text-align: center;
            color: #555;
        }

        form {
            max-width: 500px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        .consent {
            margin-top: 15px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Formulario Participa</h1>
    <p>Este formulario permite enviar ideas o propuestas para mejorar nuestra comunidad.</p>

    <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" jose-castro  name="nombre" jose-  catro placeholder="Escribe tu nombre" required>

        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo"carloscastros96@icloud.com name="correo" placeholder="Escribe tu correo" required>

        <label for="mensaje">Propuesta o mensaje</label>
        <textarea id="mensaje" name="mensaje" placeholder="Escribe aquí tu propuesta o comentario"  participar de manera segura y respetuosa, compartiendo ideas que ayuden a mejorar la convivencia y la comunicación en la comunidad. Considero importante que la información que se reciba sea verificada y usada de forma responsable, para evitar la desinformación y promover el respeto entre los participantes. Además, es fundamental que estas herramientas sean accesibles para todos, sin importar su nivel de conocimiento tecnológico, fomentando así la inclusión digital y la participación ciudadana. required></textarea>

        <div class="consent">
            <input type="checkbox" id="consentimiento" required>
            <label for="consentimiento">
                Acepto que la información proporcionada sea utilizada únicamente con fines educativos.
            </label>
        </div>

        <button type="submit">Enviar propuesta</button>
    </form>

</body>
</html>
